{% extends "base.html" %}
{% block title %}Access Logs{% endblock %}
{% block page_title %}Access Logs{% endblock %}

{% block content %}


<div class="page-header">
    <h1>Access Logs</h1>
    <p>Full history of door access events.</p>
</div>

<div class="card">
    <div class="card-title">Log History</div>

    
    <p id="loading-msg" style="color:var(--muted); font-size:14px;">Loading logs...</p>

   
    <div id="logs-table-wrap" style="display:none; overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:14px;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border); text-align:left;">
                    <th style="padding:10px 12px; color:var(--muted); font-weight:500;">Name</th>
                    <th style="padding:10px 12px; color:var(--muted); font-weight:500;">Card UID</th>
                    <th style="padding:10px 12px; color:var(--muted); font-weight:500;">Method</th>
                    <th style="padding:10px 12px; color:var(--muted); font-weight:500;">Result</th>
                    <th style="padding:10px 12px; color:var(--muted); font-weight:500;">Time</th>
                </tr>
            </thead>
            <tbody id="logs-body">
                
            </tbody>
        </table>
    </div>

    <p id="no-logs-msg" style="display:none; color:var(--muted); font-size:14px;">No access logs found.</p>
</div>

<script>
   
    fetch("/api/logs")
        .then(response => response.json())
        .then(logs => {
            const loading = document.getElementById("loading-msg");
            const tableWrap = document.getElementById("logs-table-wrap");
            const tbody = document.getElementById("logs-body");
            const noLogs = document.getElementById("no-logs-msg");

            loading.style.display = "none"; 

            if (logs.length === 0) {
                
                noLogs.style.display = "block";
                return;
            }

            
            logs.forEach(log => {
                const row = document.createElement("tr");
                row.style.borderBottom = "1px solid var(--border)";

                
                const name = (log.first_name && log.last_name)
                    ? `${log.first_name} ${log.last_name}`
                    : "Unknown";

                
                const resultColour = log.result === "granted" ? "#22c55e" : "#ef4444";
                const resultBadge = `
                    <span style="
                        background:${resultColour}22;
                        color:${resultColour};
                        padding:2px 10px;
                        border-radius:999px;
                        font-size:12px;
                        font-weight:500;
                        text-transform:capitalize;
                    ">${log.result}</span>`;

                
                const date = new Date(log.created);
                const formatted = date.toLocaleString("en-GB", {
                    day: "2-digit", month: "short", year: "numeric",
                    hour: "2-digit", minute: "2-digit"
                });

                
                row.innerHTML = `
                    <td style="padding:10px 12px;">${name}</td>
                    <td style="padding:10px 12px; font-family:monospace;">${log.nfc_uid}</td>
                    <td style="padding:10px 12px;">${log.method}</td>
                    <td style="padding:10px 12px;">${resultBadge}</td>
                    <td style="padding:10px 12px; color:var(--muted);">${formatted}</td>
                `;

                tbody.appendChild(row); 
            });

            tableWrap.style.display = "block"; 
        })
        .catch(err => {
            
            document.getElementById("loading-msg").textContent = "Failed to load logs.";
            console.error("Logs fetch error:", err);
        });
</script>

{% endblock %}
